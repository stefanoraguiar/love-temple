name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Construir
        run: npm run build
        env:
          INSCRICAO_EMAIL: ${{ secrets.INSCRICAO_EMAIL }}
          STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: CNAME
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          domain = os.environ.get("CUSTOM_DOMAIN", "").strip().lower().rstrip(".")
          if not domain:
              raise SystemExit(0)
          if not re.fullmatch(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}", domain):
              raise SystemExit(f"CUSTOM_DOMAIN inválido: {domain!r}")
          pathlib.Path("out/CNAME").write_text(domain + "\n", encoding="utf-8")
          PY

      - name: Enviar artefactos
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
